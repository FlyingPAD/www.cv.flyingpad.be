@if(visible()){
  <button
    class="back-to-top"
    type="button"
    (click)="scrollToTop()"
    [style.--scroll-angle]="progressAngle()"
    [attr.aria-label]="'shell.backToTop' | translate"
  >
    <span class="button-core" aria-hidden="true">
      <span class="arrow">↑</span>
      <span class="label">TOP</span>
    </span>
  </button>
}
