<div class="site-shell">
  <header class="site-header">
    <div class="identity">
      <span class="nine-mark" aria-hidden="true"><i class="missing"></i><i class="red"></i><i class="orange"></i><i class="yellow"></i><i class="green"></i><i class="blue"></i><i class="indigo"></i><i class="violet"></i><i class="black"></i></span>
      <a class="identity-name" routerLink="/home">Tony<br>Van Langenhove</a>
    </div>

    <nav class="desktop-nav" aria-label="Primary navigation">
      <a routerLink="/home" routerLinkActive="active">Home</a>
      <a routerLink="/work" routerLinkActive="active">Work</a>
      <a routerLink="/journey" routerLinkActive="active">Journey</a>
      <a routerLink="/profile" routerLinkActive="active">Profile</a>
      <a class="contact-link" href="mailto:tonyvan@live.fr" aria-label="Email Tony Van Langenhove — opens your mail application">Email <span aria-hidden="true">↗</span></a>
    </nav>

    <button class="menu-trigger" type="button" (click)="openMenu()" [attr.aria-expanded]="menuOpen()" aria-controls="mobile-menu">
      <span>Menu</span><i aria-hidden="true"></i>
    </button>
  </header>

  <main><ng-content /></main>
  <footer><span>Tony Van Langenhove</span><span>Belgium · 2026</span></footer>
</div>

@if(menuOpen()){
  <div class="menu-overlay" id="mobile-menu" role="dialog" aria-modal="true" aria-label="Site navigation" tabindex="-1" (keydown)="onOverlayKeydown($event)">
    <div class="overlay-top">
      <div class="overlay-signature" aria-hidden="true">
        <span class="overlay-mark"><i></i><i class="red"></i><i class="orange"></i><i class="yellow"></i><i class="green"></i><i class="blue"></i><i class="indigo"></i><i class="violet"></i><i class="black"></i></span>
        <span>Navigation</span>
      </div>
      <button class="close-menu" type="button" (click)="closeMenu()" aria-label="Close navigation">Close <span aria-hidden="true">×</span></button>
    </div>

    <nav class="overlay-nav" aria-label="Mobile navigation">
      <a routerLink="/home" routerLinkActive="active" (click)="closeMenu()"><small>01</small><span>Home</span><i aria-hidden="true">→</i></a>
      <a routerLink="/work" routerLinkActive="active" (click)="closeMenu()"><small>02</small><span>Work</span><i aria-hidden="true">→</i></a>
      <a routerLink="/journey" routerLinkActive="active" (click)="closeMenu()"><small>03</small><span>Journey</span><i aria-hidden="true">→</i></a>
      <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()"><small>04</small><span>Profile</span><i aria-hidden="true">→</i></a>
    </nav>

    <div class="overlay-bottom">
      <span>Direct contact</span>
      <a href="mailto:tonyvan@live.fr" (click)="closeMenu()" aria-label="Email Tony Van Langenhove — opens your mail application">Email me <i aria-hidden="true">↗</i></a>
    </div>
  </div>
}
