<app-site-shell section="journey">
  <section class="timeline">
    @for(era of eras;track era.year;let i=$index){
      <article class="era">
        <div class="marker"><span>{{(i+1).toString().padStart(2,'0')}}</span><i></i></div>
        <div class="date">{{era.year}}</div>
        <div class="content"><small>{{era.kind}}</small><h2>{{era.title}}</h2><p>{{era.body}}</p><div class="details">@for(item of era.detail;track item){<span>{{item}}</span>}</div></div>
      </article>
    }
  </section>
</app-site-shell>
