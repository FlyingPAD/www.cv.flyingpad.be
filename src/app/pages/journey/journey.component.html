<app-site-shell section="journey">
  <section class="timeline">
    @for(era of eras;track era.year){
      <article class="era">
        <div class="marker" aria-hidden="true"><i></i></div>
        <div class="date">{{era.year}}</div>
        <div class="content"><small>{{era.kind}}</small><h2>{{era.title}}</h2><p>{{era.body}}</p><div class="details cv-chip-list">@for(item of era.detail;track item){<span class="cv-chip">{{item}}</span>}</div></div>
      </article>
    }
  </section>
</app-site-shell>
