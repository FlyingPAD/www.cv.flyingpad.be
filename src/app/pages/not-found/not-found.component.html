<app-site-shell>
  <section class="not-found">
    <div class="code" aria-hidden="true">404</div>
    <div class="copy">
      <p>{{ 'notFound.kicker' | translate }}</p>
      <h1>{{ 'notFound.title' | translate }}</h1>
      <div class="signal" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="detail">{{ 'notFound.detail' | translate }}</p>
      <a class="cv-action" routerLink="/home">
        <span class="cv-action-copy"><b>{{ 'notFound.back' | translate }}</b><em>{{ 'notFound.backHint' | translate }}</em></span>
        <span class="cv-action-arrow" aria-hidden="true">→</span>
      </a>
    </div>
  </section>
</app-site-shell>
